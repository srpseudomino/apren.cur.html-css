<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../imagens/imgfavicon/caixasflexiveis2.png" type="image/x-icon">
        <title>Flexible Box 12</title>
        <style>
            div.container {
                display: flex;
                flex-flow: row nowrap;
                background-color: lightseagreen;
                border: 3px dashed black;
            }
            div.itens {
                background-color: lightpink;
                text-align: center;
                border: 1px solid white;
            }
            div#caixa1 {
                /*
                flex-grow: 1;
                flex-shrink: 0;
                flex-basis: 200px;
                flex: 1 0 200px;
                */
                flex: initial;
                width: 150px;
            }
            div#caixa2 {
                /*
                flex-grow: 1;
                flex-shrink: 1;
                flex-basis: 150px;
                */
                flex: 1 1 auto;
            }
            div#caixa3 {
                /*
                flex-grow: 1;
                flex-shrink: 8;
                flex-basis: auto;
                flex: 1 8 auto;
                */
                flex: none;    
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="itens" id="caixa1">A</div>
            <div class="itens" id="caixa2">B</div>
            <div class="itens" id="caixa3">C</div>
        </div>
    </body>
</html>
