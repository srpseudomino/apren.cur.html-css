<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <link rel="shortcut icon" href="../imagens/imgfavicon/caixasflexiveiscentralizada.png" type="image/x-icon">
    <style>
        * {

            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

        }
        body {

            background-color: #f08080;

        }
        main {

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            background-color: #3F6E50;
            width: 90vw;
            height: 90vh;

        }
        section {

            background-color: #ADEEC5;
            width: 200px;
            height: 200px;

        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>
</html>
