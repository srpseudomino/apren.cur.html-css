<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../imagens/imgfavicon/caixasflexiveis2.png" type="image/x-icon">
        <title>Flexible Box 4</title>
        <style>
            div.container {
                display: flex;
                flex-flow: row nowrap;
                justify-content: space-around;
                align-items: stretch;
                background-color: lightseagreen;
                height: 250px;
                border: 3px dashed black;
            }
            div.itens {
                background-color: lightpink;
                text-align: center;
                border: 1px solid white;
                
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="itens">A</div>
            <div class="itens">B</div>
            <div class="itens">C</div>
            <div class="itens">D</div>
            <div class="itens">E</div>
            <div class="itens">F</div>
            <div class="itens">G</div>
        </div>
    </body>
</html>
